<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Defence Intelligence & Decision Support</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #121b2e;
    --border: #22304a;
    --text: #e6ecf5;
    --muted: #93a3bd;
    --accent: #4f8cff;
    --low: #2fae66;
    --medium: #e6b93b;
    --high: #e07b3b;
    --critical: #e0483b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  body {
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

  #chatLog {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 12px;
  }
  .chat-inner {
    max-width: 860px;
    margin: 0 auto;
  }

  .empty-state {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    margin-top: 60px;
  }

  .turn { margin-bottom: 22px; }

  .user-bubble {
    background: var(--accent);
    color: white;
    padding: 10px 16px;
    border-radius: 14px 14px 4px 14px;
    max-width: 75%;
    margin-left: auto;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .user-row { display: flex; margin-bottom: 8px; }

  .assistant-row { display: flex; flex-direction: column; }

  .status-line {
    color: var(--muted);
    font-size: 13px;
    margin: 4px 0 12px 2px;
  }
  .error-box {
    background: #2a1414;
    border: 1px solid var(--critical);
    color: #ffb3ab;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 14px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 12px;
  }
  .card h2 {
    margin: 0 0 8px;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .card p { margin: 0; line-height: 1.6; font-size: 15px; }
  .card ul { margin: 8px 0 0; padding-left: 20px; line-height: 1.7; font-size: 14px; }

  .risk-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .risk-LOW { background: rgba(47,174,102,0.15); color: var(--low); }
  .risk-MEDIUM { background: rgba(230,185,59,0.15); color: var(--medium); }
  .risk-HIGH { background: rgba(224,123,59,0.15); color: var(--high); }
  .risk-CRITICAL { background: rgba(224,72,59,0.15); color: var(--critical); }

  .evidence-item {
    border-top: 1px solid var(--border);
    padding: 12px 0;
    font-size: 14px;
  }
  .evidence-item:first-child { border-top: none; padding-top: 0; }
  .evidence-source {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
  }

  .confidence-bar-track {
    background: var(--border);
    border-radius: 999px;
    height: 8px;
    width: 100%;
    margin-top: 6px;
    overflow: hidden;
  }
  .confidence-bar-fill {
    background: var(--accent);
    height: 100%;
  }

  .typing-dots span {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-right: 3px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

  footer {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    padding: 14px 20px;
  }
  .input-inner {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }
  #queryInput {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    resize: none;
  }
  #submitBtn {
    padding: 0 22px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  #submitBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  .new-chat-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    float: right;
    margin-top: -30px;
  }
  .new-chat-btn:hover { color: var(--text); border-color: var(--accent); }

  .settings { display: none; }
</style>
</head>
<body>

<header>
  <button class="new-chat-btn" onclick="startNewChat()">New chat</button>
  <h1>Defence Intelligence &amp; Decision Support</h1>
  <p>Autonomous multi-agent RAG system — SIPRI + GDELT evidence, analyzed and risk-assessed</p>
</header>

<div class="settings">
  <input type="text" id="apiBase" value="" />
  <input type="text" id="apiKey" value="my-secret-key-123" />
</div>

<div id="chatLog">
  <div class="chat-inner" id="chatInner">
    <div class="empty-state" id="emptyState">Ask a question to start — e.g. "Assess the emerging security situation involving India"</div>
  </div>
</div>

<footer>
  <div class="input-inner">
    <textarea id="queryInput" rows="1" placeholder="Ask about a country, region, or situation..."></textarea>
    <button id="submitBtn" onclick="submitQuery()">Send</button>
  </div>
</footer>

<script>
let sessionId = localStorage.getItem('chatSessionId');
if (!sessionId) {
  sessionId = crypto.randomUUID();
  localStorage.setItem('chatSessionId', sessionId);
}

function startNewChat() {
  sessionId = crypto.randomUUID();
  localStorage.setItem('chatSessionId', sessionId);
  document.getElementById('chatInner').innerHTML =
    '<div class="empty-state" id="emptyState">Ask a question to start — e.g. "Assess the emerging security situation involving India"</div>';
}

function scrollToBottom() {
  const log = document.getElementById('chatLog');
  log.scrollTop = log.scrollHeight;
}

async function submitQuery() {
  const input = document.getElementById('queryInput');
  const query = input.value.trim();
  const apiBase = document.getElementById('apiBase').value.trim().replace(/\/$/, '');
  const apiKey = document.getElementById('apiKey').value.trim();
  const btn = document.getElementById('submitBtn');
  const chatInner = document.getElementById('chatInner');

  if (!query) return;

  const emptyState = document.getElementById('emptyState');
  if (emptyState) emptyState.remove();

  // Render the user's message immediately
  const turnId = 'turn-' + Date.now();
  const userDiv = document.createElement('div');
  userDiv.className = 'turn';
  userDiv.innerHTML = `
    <div class="user-row"><div class="user-bubble">${escapeHtml(query)}</div></div>
    <div class="assistant-row" id="${turnId}">
      <div class="status-line typing-dots"><span></span><span></span><span></span></div>
    </div>
  `;
  chatInner.appendChild(userDiv);
  input.value = '';
  autoResize(input);
  scrollToBottom();

  btn.disabled = true;
  input.disabled = true;

  try {
    const resp = await fetch(`${apiBase}/assess`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-API-Key': apiKey,
      },
      body: JSON.stringify({ query, session_id: sessionId }),
    });

    const data = await resp.json();
    const target = document.getElementById(turnId);

    if (!resp.ok) {
      const detail = typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail);
      target.innerHTML = `<div class="error-box">Request failed (${resp.status}): ${escapeHtml(detail)}</div>`;
      return;
    }

    target.innerHTML = renderReport(data.report, data.errors || []);
  } catch (err) {
    const target = document.getElementById(turnId);
    target.innerHTML = `<div class="error-box">Could not reach the API at "${escapeHtml(apiBase)}". Is the backend running? (${escapeHtml(String(err))})</div>`;
  } finally {
    btn.disabled = false;
    input.disabled = false;
    input.focus();
    scrollToBottom();
  }
}

function renderReport(report, errors) {
  let html = '';

  if (errors && errors.length > 0) {
    html += `<div class="error-box">Some agents reported non-fatal errors: ${errors.map(escapeHtml).join(' | ')}</div>`;
  }

  const risk = report.risk_assessment || {};
  html += `
    <div class="card">
      <h2>Executive Summary</h2>
      <p>${escapeHtml(report.executive_summary || '—')}</p>
    </div>

    <div class="card">
      <h2>Risk Assessment</h2>
      <span class="risk-badge risk-${risk.risk_level || 'LOW'}">${risk.risk_level || 'UNKNOWN'}</span>
      <span style="margin-left:10px; color:var(--muted); font-size:13px;">score ${risk.risk_score ?? '—'}/100</span>
      <p style="margin-top:10px;">${escapeHtml(risk.reasoning_summary || '')}</p>
      ${renderList('Risk factors', risk.risk_factors)}
    </div>

    <div class="card">
      <h2>Threat Overview</h2>
      <p>${escapeHtml(report.threat_overview || '—')}</p>
    </div>

    <div class="card">
      <h2>Key Findings</h2>
      ${renderList(null, report.key_findings)}
    </div>

    <div class="card">
      <h2>Verified Facts</h2>
      ${renderList(null, report.verified_facts)}
    </div>

    <div class="card">
      <h2>Supporting Evidence</h2>
      ${renderEvidence(report.supporting_evidence)}
    </div>

    <div class="card">
      <h2>Recommendations</h2>
      ${renderList(null, report.recommendations)}
    </div>

    <div class="card">
      <h2>Confidence</h2>
      <div class="confidence-bar-track">
        <div class="confidence-bar-fill" style="width:${Math.round((report.confidence || 0) * 100)}%"></div>
      </div>
      <p style="margin-top:6px; font-size:13px; color:var(--muted);">${Math.round((report.confidence || 0) * 100)}%</p>
    </div>

    <div class="card">
      <h2>Sources</h2>
      ${renderList(null, report.sources)}
    </div>
  `;

  return html;
}

function renderList(title, items) {
  if (!items || items.length === 0) {
    return `<p style="color:var(--muted)">None reported.</p>`;
  }
  const listHtml = `<ul>${items.map(i => `<li>${escapeHtml(String(i))}</li>`).join('')}</ul>`;
  return title ? `<p><strong>${escapeHtml(title)}</strong></p>${listHtml}` : listHtml;
}

function renderEvidence(evidence) {
  if (!evidence || evidence.length === 0) {
    return `<p style="color:var(--muted)">None reported.</p>`;
  }
  return evidence.map(e => `
    <div class="evidence-item">
      <div>${escapeHtml(e.finding || '')}</div>
      <div style="margin-top:4px; color:var(--text); opacity:0.85;">${escapeHtml(e.evidence || '')}</div>
      <div class="evidence-source">
        ${escapeHtml(e.source || 'unknown source')}
        ${e.publication_date ? ' · ' + escapeHtml(e.publication_date) : ''}
        ${e.verification_status ? ' · ' + escapeHtml(e.verification_status) : ''}
      </div>
    </div>
  `).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

const queryInput = document.getElementById('queryInput');
queryInput.addEventListener('input', () => autoResize(queryInput));
queryInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    submitQuery();
  }
});
</script>

</body>
</html>
